<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FLUTGRABEN TYPEFACE</title>
  <meta name="description" content="Dynamic Type Generator">
  <meta name="keywords" content="HTML, CSS, JavaScript-opentype.js">
  <meta name="author" content="Zoé Berthelot @Neutronzoo">
  <link rel="icon" type="image/x-icon" href="ico/ico_dott_256px_03.png">
  <link rel="stylesheet" href="CSS/style.css" />
</head>
<body>

  <!-- ===================== LEFT PANELS — vertical stack ===================== -->
  <div id="panels-left">

  <!-- ===================== MAIN PANEL — controls sidebar ===================== -->
    <div id="top-panel">
      
    <!-- STEP 1 — contenteditable div with DINish -->
    <div class="stage">
      <!-- <span class="step-label">step 1 — text</span> -->
      <div class="panel">
        <div id="text-input" contenteditable="true" spellcheck="false">Text</div>
      </div>
    </div>

    <!-- STEP 2 — bilinear mesh gradient clipped to text shape -->
    <div class="stage" id="stage-gradient">
      <!-- <span class="step-label">step 2 — gradient</span> -->
      <div id="panel-gradient">
        <canvas id="gradient-canvas"></canvas>
      </div>
    </div>
    <!-- SHAPE — selector -->
    <div id="shape-selector">
      <!-- <span class="step-label">shape</span> -->
      <div class="shape-btns">

        <button class="shape-btn active" data-shape="circle" title="Circle">
          <svg viewBox="0 0 2 2" xmlns="http://www.w3.org/2000/svg">
            <circle cx="1" cy="1" r="1" fill="#000000" />
          </svg>
        </button>

        <button class="shape-btn" data-shape="square" title="Square">
          <svg viewBox="0 0 2 2" xmlns="http://www.w3.org/2000/svg">
            <rect x="0" y="0" width="2" height="2" fill="#ff00ff" />
          </svg>
        </button>

        <button class="shape-btn" data-shape="ellipse" title="Ellipse">
          <svg viewBox="0 0 2 2.75" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="1" cy="1.375" rx="1" ry="1.375" fill="#000000" />
          </svg>
        </button>

        <button class="shape-btn" data-shape="trait" title="Trait">
          <svg viewBox="0 0 3.614 1.7" xmlns="http://www.w3.org/2000/svg">
            <rect x="0" y="0" width="3.614" height="1.7" rx="0.85" fill="#000000" />
          </svg>
        </button>

        <button class="shape-btn" data-shape="circle_outline" title="Circle outline">
          <svg viewBox="0 0 2.314 2.314" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" fill="#000000" d="M 1.157,0 C 1.796,0 2.314,0.518 2.314,1.157 C 2.314,1.796 1.796,2.314 1.157,2.314 C 0.518,2.314 0,1.796 0,1.157 C 0,0.518 0.518,0 1.157,0 Z M 1.157,0.399 C 1.576,0.399 1.915,0.738 1.915,1.157 C 1.915,1.576 1.576,1.915 1.157,1.915 C 0.738,1.915 0.399,1.576 0.399,1.157 C 0.399,0.738 0.738,0.399 1.157,0.399 Z" />
          </svg>
        </button>

      </div>
    </div>

    <!-- MESH — grid size for bilinear gradient (0 = solid black, no mesh) -->
    <div class="slider-row">
      <label for="mesh-slider">Mesh</label>
      <input type="range" id="mesh-slider" min="0" max="4" step="1" value="0" />
      <span id="mesh-value">0</span>
    </div>

    <!-- SIZE PREGENERATION — scales dot radius and grid spacing together -->
    <div class="slider-row">
      <label for="taille-generation-slider">Size pregeneration</label>
      <input type="range" id="taille-generation-slider" min="0.25" max="3" step="0.05" value="1" />
      <span id="taille-generation-value">1.00</span>
    </div>

    <!-- SIZE POSTGENERATION — scales dot radius only -->
    <div class="slider-row">
      <label for="size-slider">Size postgeneration</label>
      <input type="range" id="size-slider" min="0.25" max="3" step="0.05" value="1" />
      <span id="size-value">1.00</span>
    </div>

    <!-- PRESENCE — probabilistic dot filter -->
    <div class="slider-row">
      <label for="presence-slider">Hazard</label>
      <input type="range" id="presence-slider" min="0" max="1" step="0.01" value="0.5" />
      <span id="presence-value">0.5</span>
    </div>



  </div>
  
  <!-- ===================== OFFSET PANEL — contour controls ===================== -->
  <div id="top-panel-offset">

    <!-- STEP 3 — contour preview canvas (blurred halo visualization) -->
    <div class="stage" id="stage-contour">
      <!-- <span class="step-label">step 3 — contour</span> -->
      <div id="panel-contour">
        <canvas id="contour-canvas"></canvas>
      </div>
    </div>

    <!-- HALO — Gaussian blur radius defining the contour zone width -->
    <div class="slider-row">
      <label for="outset-slider">Halo</label>
      <input type="range" id="outset-slider" min="0" max="30" step="1" value="8" />
      <span id="outset-value">8</span>
    </div>

    <!-- CONTOUR HAZARD — probabilistic dot filter for the contour zone -->
    <div class="slider-row">
      <label for="contour-hazard-slider">Hazard</label>
      <input type="range" id="contour-hazard-slider" min="0" max="1" step="0.01" value="0.5" />
      <span id="contour-hazard-value">0.50</span>
    </div>

    <!-- CONTOUR SIZE PREGENERATION — scales dot radius and grid spacing together -->
    <div class="slider-row">
      <label for="contour-taille-generation-slider">Size pregeneration</label>
      <input type="range" id="contour-taille-generation-slider" min="0.25" max="3" step="0.05" value="1" />
      <span id="contour-taille-generation-value">1.00</span>
    </div>

    <!-- CONTOUR SIZE POSTGENERATION — scales dot radius only -->
    <div class="slider-row">
      <label for="contour-size-slider">Size postgeneration</label>
      <input type="range" id="contour-size-slider" min="0.25" max="3" step="0.05" value="1" />
      <span id="contour-size-value">1.00</span>
    </div>

  </div>

  <div id="top-panel-export">
        <!-- EXPORT -->
    <div class="flex">
      <span class="step-label">Export</span>
      <button id="export-btn">SVG</button>
      <button id="export-png-btn">PNG</button>
      <button id="export-otf-btn">OTF</button>
    </div>

  </div>

  </div><!-- /panels-left -->


  <!-- ===================== RIGHT PANEL — dot output ===================== -->
  <div id="stage-output">
    <svg id="output" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!--
          Base clone shape — defined as a <symbol> so width/height on <use>
          controls sizing. Updated dynamically when the user selects a shape.
        -->
        <symbol id="base-dot" viewBox="0 0 2 2" preserveAspectRatio="xMidYMid meet">
          <circle cx="1" cy="1" r="1" fill="#000000" />
        </symbol>
      </defs>
    </svg>
  </div>

  <!--
    Hidden canvas — text mask (solid black text on white background).
    Used to determine which pixels belong to the text shape.
  -->
  <canvas id="hidden-canvas" style="display:none;"></canvas>

  <script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
  <script src="js/script-generator_DottFont.js"></script>
  <script src="js/offset.js"></script>
  <script src="js/export-otf.js"></script>

</body>
</html>
